# K2 SE DXC Extruder Configuration
# Dual Extruder Control Setup for Creality K2 SE

[mcu]
serial: /dev/serial/by-id/usb-1a86_7523-if00-port0
baud: 250000

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

# Extruder 0 (Primary)
[extruder]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.710
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
heater_pin: PA2
sensor_type: EPCOS 100K B57860S104F
sensor_pin: PA0
control: pid
pid_Kp: 28.169
pid_Ki: 1.491
pid_Kd: 133.019
min_temp: 0
max_temp: 300
min_extrude_temp: 170
pressure_advance: 0.04

# Extruder 1 (Secondary - DXC)
[extruder1]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC11
microsteps: 16
rotation_distance: 7.710
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
heater_pin: PC9
sensor_type: EPCOS 100K B57860S104F
sensor_pin: PC4
control: pid
pid_Kp: 28.169
pid_Ki: 1.491
pid_Kd: 133.019
min_temp: 0
max_temp: 300
min_extrude_temp: 170
pressure_advance: 0.04

# Extruder Selector
[gcode_macro SELECT_EXTRUDER]
description: Select active extruder (0, 1, or 2 for all)
gcode:
    {% set extruder = params.EXTRUDER|int %}
    {% if extruder == 0 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        M117 Extruder 1 Selected
    {% elif extruder == 1 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        M117 Extruder 2 Selected
    {% elif extruder == 2 %}
        M117 Both Extruders Ready
    {% endif %}

[gcode_macro T0]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    M117 Tool 0 - Extruder 1

[gcode_macro T1]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    M117 Tool 1 - Extruder 2

[gcode_macro T2]
gcode:
    M117 Both Extruders Active (Mirror Mode)

# Dual Extrusion Utilities
[gcode_macro PURGE_EXTRUDER]
description: Purge current extruder
gcode:
    {% set purge_amount = params.AMOUNT|default(10)|float %}
    G91
    G1 E{purge_amount} F300
    G90

[gcode_macro PRIME_EXTRUDERS]
description: Prime both extruders
gcode:
    T0
    PURGE_EXTRUDER AMOUNT=15
    T1
    PURGE_EXTRUDER AMOUNT=15
    T0
    M117 Extruders Primed

[gcode_macro SET_EXTRUDER_TEMP]
description: Set extruder temperature
gcode:
    {% set extruder = params.EXTRUDER|default(0)|int %}
    {% set temp = params.TEMP|default(200)|float %}
    {% if extruder == 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
    {% elif extruder == 1 %}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
    {% elif extruder == 2 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
    {% endif %}

[gcode_macro TOGGLE_EXTRUDER]
description: Toggle between primary and secondary extruder
gcode:
    {% if printer.toolhead.extruder == 'extruder' %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        M117 Switched to Extruder 2
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        M117 Switched to Extruder 1
    {% endif %}

# Filament Runout Sensor - Extruder 0
[filament_motion_sensor filament_sensor_e0]
detection_length: 10
extruder: extruder
switch_pin: PC10
runout_gcode:
    PAUSE
    M117 Filament Runout - E0

# Filament Runout Sensor - Extruder 1
[filament_motion_sensor filament_sensor_e1]
detection_length: 10
extruder: extruder1
switch_pin: PA11
runout_gcode:
    PAUSE
    M117 Filament Runout - E1

# Bed Heater
[heater_bed]
heater_pin: PA3
sensor_type: EPCOS 100K B57860S104F
sensor_pin: PA1
control: pid
pid_Kp: 71.180
pid_Ki: 1.197
pid_Kd: 1055.556
min_temp: 0
max_temp: 120

# Steppers
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: PC0
position_min: 0
position_endstop: 0
position_max: 234
homing_speed: 50

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: PC1
position_min: 0
position_endstop: 0
position_max: 234
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: PC2
position_min: 0
position_endstop: 0
position_max: 250
homing_speed: 10

# Bed Mesh
[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 224, 224
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2

# Auto Bed Leveling
[bltouch]
sensor_pin: PC14
control_pin: PB5
x_offset: 0
y_offset: 0
z_offset: 0.0
speed_z_raise: 10
speed_z_lower: 10
probe_with_touch_mode: True

# Display
[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PA6, ^PA7
click_pin: !PC8
menu_timeout: 40
