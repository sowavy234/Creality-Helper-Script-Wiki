# K2 SE Custom KlipperScreen Configuration
# Complete UI revamp for 7-inch display

[main]
# Main configuration
language: en
show_heater_power: True
print_sort_reverse: False
# Remove default menu
default_view: extruder

[printer K2 SE]
# Printer name and configuration
name: K2 SE DXC

[preheat PLA]
bed: 60
extruder: 200
extruder1: 200

[preheat PETG]
bed: 80
extruder: 230
extruder1: 230

[preheat ABS]
bed: 100
extruder: 240
extruder1: 240

[preheat TPU]
bed: 60
extruder: 220
extruder1: 220

# ============================================================================
# CUSTOM THEME - CREALITY ORANGE
# ============================================================================

[font Small]
size: 14

[font Small_Bold]
size: 14
bold: True

[font Medium]
size: 18

[font Medium_Bold]
size: 18
bold: True

[font Large]
size: 24

[font Large_Bold]
size: 24
bold: True

[font Huge]
size: 32

[font Huge_Bold]
size: 32
bold: True

# Color scheme
[colors]
background: #1a1a1a
text: #ffffff
text_accent: #ff6b35
primary: #ff6b35
secondary: #f7931e
accent1: #ff6b35
success: #4ade80
warning: #facc15
error: #ef4444
disabled: #666666

# ============================================================================
# DISPLAY LAYOUT CONFIGURATION
# ============================================================================

[displayed_macros Macros]
# Display custom macros on screen

T0
T1
TOGGLE_EXTRUDER
LOAD_FILAMENT_E0
LOAD_FILAMENT_E1
UNLOAD_FILAMENT_E0
UNLOAD_FILAMENT_E1
PRIME_EXTRUDERS
DXC_STATUS
CALIBRATE_NOZZLE_OFFSET
DUAL_COLOR_SETUP
CONVERT_TO_DXC

[menu __main]
name: Main Menu

[menu __main __temp]
name: Temperature
icon: extruder
panel: temperature

[menu __main __motion]
name: Movement
icon: move
panel: move

[menu __main __extrude]
name: Extrude
icon: extrude
panel: extrude

[menu __main __print]
name: Print
icon: print
panel: print

[menu __main __calibration]
name: Calibration
icon: calibrate
panel: calibration

[menu __main __dxc]
name: DXC Control
icon: extruder
panel: dxc_control

[menu __main __macros]
name: Macros
icon: gcode
panel: gcode_macros

[menu __main __network]
name: Network
icon: network
panel: network

[menu __main __settings]
name: Settings
icon: settings
panel: settings

# ============================================================================
# TEMPERATURE PANEL
# ============================================================================

[menu __main __temp __hotend0]
name: Hotend 1
icon: extruder
panel: temperature
context_heater: extruder

[menu __main __temp __hotend1]
name: Hotend 2
icon: extruder
panel: temperature
context_heater: extruder1

[menu __main __temp __bed]
name: Bed
icon: bed
panel: temperature
context_heater: heater_bed

[menu __main __temp __preheat]
name: Preheat
icon: heat-up
panel: preheat

# ============================================================================
# MOVEMENT PANEL
# ============================================================================

[menu __main __motion __home]
name: Home
icon: home
panel: move
context_axis: all

[menu __main __motion __homexy]
name: Home XY
icon: home
panel: move
context_axis: xy

[menu __main __motion __homez]
name: Home Z
icon: home
panel: move
context_axis: z

[menu __main __motion __babystepping]
name: Babystepping
icon: z-move
panel: babystepping

# ============================================================================
# EXTRUSION PANEL
# ============================================================================

[menu __main __extrude __extrude0]
name: Extrude E1
icon: extrude
panel: extrude
context_extruder: extruder

[menu __main __extrude __extrude1]
name: Extrude E2
icon: extrude
panel: extrude
context_extruder: extruder1

# ============================================================================
# PRINT PANEL
# ============================================================================

[menu __main __print __jobs]
name: Print Jobs
icon: print
panel: print

[menu __main __print __history]
name: Print History
icon: history
panel: history

# ============================================================================
# CALIBRATION PANEL
# ============================================================================

[menu __main __calibration __offset]
name: Nozzle Offset
icon: z-move
panel: calibration
context_calibration: nozzle_offset

[menu __main __calibration __bedmesh]
name: Bed Mesh
icon: bed
panel: bed_mesh

[menu __main __calibration __pid]
name: PID Tune
icon: calibrate
panel: pid_calibration

# ============================================================================
# DXC CONTROL PANEL (CUSTOM)
# ============================================================================

[menu __main __dxc __selector]
name: Select Extruder
icon: extruder
panel: dxc_selector

[menu __main __dxc __tempcontrol]
name: Temperature Control
icon: heat-up
panel: dxc_temperature

[menu __main __dxc __filament]
name: Filament Management
icon: spool
panel: dxc_filament

[menu __main __dxc __calibration]
name: DXC Calibration
icon: calibrate
panel: dxc_calibration

[menu __main __dxc __status]
name: DXC Status
icon: info
panel: dxc_status

# ============================================================================
# POWER CONTROL
# ============================================================================

[menu __main __settings __power]
name: Power
icon: shutdown
panel: power

# ============================================================================
# STYLE CONFIGURATION
# ============================================================================

[style]
background_color: #1a1a1a
text_color: #ffffff
text_emphasis_color: #ff6b35
text_accent_color: #ff6b35
primary_color: #ff6b35
secondary_color: #f7931e
success_color: #4ade80
warning_color: #facc15
error_color: #ef4444
disabled_color: #666666

# Button styles
button_background: #2d2d2d
button_text: #ffffff
button_border: #ff6b35

# Accent elements
panel_background: #2d2d2d
panel_border: #ff6b35

# ============================================================================
# SCREEN CONFIGURATION
# ============================================================================

[display]
# Screen updates
update_interval: 1
error_timeout: 120

# Brightness control
on_startup: 100
on_idle: 50
power_on_delay: 0.5

# Button configuration
back_button: True
menu_timeout: 600

# ============================================================================
# NOTIFICATIONS
# ============================================================================

[notifications]
# Notification settings
display_time: 3
position: top
opacity: 0.95

# ============================================================================
# SYSTEM TRAY
# ============================================================================

[tray]
show_heater_temp: True
show_bed_temp: True
show_print_time: True
show_filament: True

# ============================================================================
# BOTTOM BAR
# ============================================================================

[bottombar]
show_extruder: True
show_bed: True
show_velocity: True
show_acceleration: True

# ============================================================================
# CUSTOMIZATION
# ============================================================================

# Extruder names
[extruder]
name: Extruder 1

[extruder1]
name: Extruder 2

# Fan configuration
[fan]
name: Layer Fan

[fan1]
name: Hotend Fan

# ============================================================================
# ADVANCED SETTINGS
# ============================================================================

[logging]
# Logging
level: info
log_file: ~/.config/KlipperScreen/KlipperScreen.log

[camera]
# Camera support (optional)
enabled: False

[gcode_macro_display]
# Display macros
show_in_menu: True
sort_alphabetically: False
