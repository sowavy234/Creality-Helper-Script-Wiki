# K2 SE Macros Configuration
# Comprehensive macro suite for K2 SE DXC operation

# ============================================================================
# EXTRUDER SELECTION & SWITCHING
# ============================================================================

[gcode_macro T0]
description: Select extruder 0 (Tool 0)
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    M117 Tool 0 - Extruder 1 Selected

[gcode_macro T1]
description: Select extruder 1 (Tool 1)
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    M117 Tool 1 - Extruder 2 Selected

[gcode_macro T2]
description: Both extruders active (Mirror mode)
gcode:
    M117 Both Extruders Active - Mirror Mode

[gcode_macro SELECT_EXTRUDER]
description: Select active extruder (E0, E1, or BOTH)
gcode:
    {% set extruder = params.EXTRUDER|default(0)|int %}
    {% if extruder == 0 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        M117 Extruder 1 Selected
    {% elif extruder == 1 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        M117 Extruder 2 Selected
    {% elif extruder == 2 %}
        M117 Both Extruders Ready
    {% endif %}

[gcode_macro TOGGLE_EXTRUDER]
description: Toggle between primary and secondary extruder
gcode:
    {% if printer.toolhead.extruder == 'extruder' %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        M117 Switched to Extruder 2
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        M117 Switched to Extruder 1
    {% endif %}

# ============================================================================
# TEMPERATURE CONTROL
# ============================================================================

[gcode_macro SET_EXTRUDER_TEMP]
description: Set extruder temperature (EXTRUDER=0/1/2, TEMP=value)
gcode:
    {% set extruder = params.EXTRUDER|default(0)|int %}
    {% set temp = params.TEMP|default(200)|float %}
    {% if extruder == 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        M117 E0 -> {temp}°C
    {% elif extruder == 1 %}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
        M117 E1 -> {temp}°C
    {% elif extruder == 2 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
        M117 Both -> {temp}°C
    {% endif %}

[gcode_macro HEAT_EXTRUDERS]
description: Heat both extruders to temperature
gcode:
    {% set temp = params.TEMP|default(200)|float %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
    M117 Heating both to {temp}°C...
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp-5}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={temp-5}
    M117 Both extruders ready!

[gcode_macro COOL_EXTRUDERS]
description: Turn off both extruder heaters
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
    M117 Extruders cooling...

# ============================================================================
# FILAMENT MANAGEMENT
# ============================================================================

[gcode_macro LOAD_FILAMENT_E0]
description: Load filament into extruder 0
gcode:
    {% set temp = params.TEMP|default(200)|float %}
    M117 Loading Filament E0...
    T0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp-5}
    M117 Filament loaded into extruder, extrude 10mm
    G91
    G1 E10 F300
    G90
    M117 E0 Loaded

[gcode_macro LOAD_FILAMENT_E1]
description: Load filament into extruder 1
gcode:
    {% set temp = params.TEMP|default(200)|float %}
    M117 Loading Filament E1...
    T1
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={temp-5}
    M117 Filament loaded into extruder, extrude 10mm
    G91
    G1 E10 F300
    G90
    M117 E1 Loaded

[gcode_macro UNLOAD_FILAMENT_E0]
description: Unload filament from extruder 0
gcode:
    {% set temp = params.TEMP|default(200)|float %}
    M117 Unloading Filament E0...
    T0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp-5}
    G91
    G1 E-50 F300
    G90
    M117 E0 Unloaded

[gcode_macro UNLOAD_FILAMENT_E1]
description: Unload filament from extruder 1
gcode:
    {% set temp = params.TEMP|default(200)|float %}
    M117 Unloading Filament E1...
    T1
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={temp-5}
    G91
    G1 E-50 F300
    G90
    M117 E1 Unloaded

[gcode_macro PURGE_EXTRUDER]
description: Purge current extruder
gcode:
    {% set amount = params.AMOUNT|default(10)|float %}
    G91
    G1 E{amount} F300
    G90

[gcode_macro PRIME_EXTRUDERS]
description: Prime both extruders
gcode:
    T0
    PURGE_EXTRUDER AMOUNT=15
    T1
    PURGE_EXTRUDER AMOUNT=15
    T0
    M117 Extruders Primed

# ============================================================================
# DUAL COLOR PRINTING
# ============================================================================

[gcode_macro DUAL_COLOR_SETUP]
description: Setup for dual color printing - full initialization
gcode:
    M117 Initializing Dual Color Setup...
    # Home all axes
    G28
    # Level bed
    BED_MESH_CALIBRATE
    # Heat both extruders
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=210
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=210
    # Wait for heating
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=205
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM=205
    # Prime both nozzles
    T0
    G1 X10 Y10 Z0.2 F6000
    PURGE_EXTRUDER AMOUNT=15
    T1
    G1 X25 Y10 Z0.2 F6000
    PURGE_EXTRUDER AMOUNT=15
    T0
    M117 Dual Color Ready - Start Print!

[gcode_macro CONVERT_TO_DXC]
description: Initialize DXC conversion
gcode:
    M117 Initializing DXC Conversion...
    # Home all axes
    G28
    # Heat both extruders to safe temperature
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=200
    # Wait for heating
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=195
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM=195
    # Select primary extruder
    T0
    M117 DXC Conversion Complete!

# ============================================================================
# EXTRUSION CONTROL
# ============================================================================

[gcode_macro RETRACT_E0]
description: Retract extruder 0
gcode:
    {% set amount = params.AMOUNT|default(2)|float %}
    T0
    G91
    G1 E-{amount} F300
    G90

[gcode_macro RETRACT_E1]
description: Retract extruder 1
gcode:
    {% set amount = params.AMOUNT|default(2)|float %}
    T1
    G91
    G1 E-{amount} F300
    G90

[gcode_macro EXTRUDE_E0]
description: Extrude from extruder 0
gcode:
    {% set amount = params.AMOUNT|default(5)|float %}
    T0
    G91
    G1 E{amount} F300
    G90

[gcode_macro EXTRUDE_E1]
description: Extrude from extruder 1
gcode:
    {% set amount = params.AMOUNT|default(5)|float %}
    T1
    G91
    G1 E{amount} F300
    G90

[gcode_macro EMERGENCY_RETRACT_ALL]
description: Emergency retract both extruders
gcode:
    T0
    G91
    G1 E-5 F500
    G90
    T1
    G91
    G1 E-5 F500
    G90
    M117 Emergency Retract Complete

# ============================================================================
# CALIBRATION & MAINTENANCE
# ============================================================================

[gcode_macro CALIBRATE_NOZZLE_OFFSET]
description: Calibrate nozzle offset between extruders
gcode:
    M117 Calibrating Nozzle Offset...
    # Home all axes
    G28
    # Move to center of bed
    G0 X117 Y117 F6000
    G0 Z20 F300
    M117 Ready for manual offset calibration
    M117 Use paper to adjust Z offset

[gcode_macro PID_CALIBRATE_E0]
description: PID calibrate extruder 0
gcode:
    {% set temp = params.TEMP|default(220)|float %}
    M117 PID calibrating E0 at {temp}°C...
    T0
    PID_CALIBRATE HEATER=extruder TARGET={temp}
    M117 PID Calibration Complete - Update config!

[gcode_macro PID_CALIBRATE_E1]
description: PID calibrate extruder 1
gcode:
    {% set temp = params.TEMP|default(220)|float %}
    M117 PID calibrating E1 at {temp}°C...
    T1
    PID_CALIBRATE HEATER=extruder1 TARGET={temp}
    M117 PID Calibration Complete - Update config!

[gcode_macro CALIBRATE_PRESSURE_ADVANCE_E0]
description: Start pressure advance tuning for E0
gcode:
    M117 Pressure Advance Calibration - E0
    T0
    M117 Print tuning tower and measure results

[gcode_macro CALIBRATE_PRESSURE_ADVANCE_E1]
description: Start pressure advance tuning for E1
gcode:
    M117 Pressure Advance Calibration - E1
    T1
    M117 Print tuning tower and measure results

# ============================================================================
# STATUS & DIAGNOSTICS
# ============================================================================

[gcode_macro DXC_STATUS]
description: Report DXC status and temperatures
gcode:
    {% if printer.toolhead.extruder == 'extruder' %}
        M117 Active: E0 | E0: {printer.extruder.temperature:.1f}°C (Target: {printer.extruder.target}°C) | E1: {printer.extruder1.temperature:.1f}°C (Target: {printer.extruder1.target}°C)
    {% else %}
        M117 Active: E1 | E0: {printer.extruder.temperature:.1f}°C (Target: {printer.extruder.target}°C) | E1: {printer.extruder1.temperature:.1f}°C (Target: {printer.extruder1.target}°C)
    {% endif %}

[gcode_macro PRINTER_STATUS]
description: Get full printer status
gcode:
    M117 Printer Status Report
    M115
    QUERY_ENDSTOPS
    DXC_STATUS

[gcode_macro CHECK_FILAMENT]
description: Check filament sensor status
gcode:
    M117 Checking Filament Sensors...
    # This will query the filament motion sensors
    QUERY_FILAMENT_SENSOR SENSOR=filament_sensor_e0
    QUERY_FILAMENT_SENSOR SENSOR=filament_sensor_e1

# ============================================================================
# BED LEVELING & MESH
# ============================================================================

[gcode_macro LEVEL_BED_QUICK]
description: Quick bed leveling (manual 4-point)
gcode:
    G28
    M117 Starting manual bed leveling...
    # 4-point leveling sequence
    G0 X30 Y30
    G0 Z0.2
    M117 Front-Left - adjust and press OK
    G0 X200 Y30
    M117 Front-Right - adjust and press OK
    G0 X200 Y200
    M117 Back-Right - adjust and press OK
    G0 X30 Y200
    M117 Back-Left - adjust and press OK
    G0 X117 Y117
    M117 Leveling Complete

[gcode_macro AUTO_BED_LEVELING]
description: Run automatic bed mesh leveling
gcode:
    M117 Starting automatic bed leveling...
    G28
    BED_MESH_CALIBRATE
    M117 Bed leveling complete!

[gcode_macro LOAD_BED_MESH]
description: Load saved bed mesh profile
gcode:
    BED_MESH_PROFILE LOAD=default
    M117 Bed mesh loaded

# ============================================================================
# MOTION CONTROL
# ============================================================================

[gcode_macro MOVE_Z_UP]
description: Move Z axis up by amount
gcode:
    {% set distance = params.DISTANCE|default(10)|float %}
    G91
    G1 Z{distance} F300
    G90
    M117 Z moved up {distance}mm

[gcode_macro MOVE_Z_DOWN]
description: Move Z axis down by amount
gcode:
    {% set distance = params.DISTANCE|default(10)|float %}
    G91
    G1 Z-{distance} F300
    G90
    M117 Z moved down {distance}mm

[gcode_macro HOME_ALL]
description: Home all axes
gcode:
    G28
    M117 All axes homed

[gcode_macro HOME_XY]
description: Home X and Y axes only
gcode:
    G28 X Y
    M117 XY homed

[gcode_macro HOME_Z]
description: Home Z axis only
gcode:
    G28 Z
    M117 Z homed

# ============================================================================
# PRINT CONTROL HELPERS
# ============================================================================

[gcode_macro PRINT_PREP]
description: Prepare for printing
gcode:
    M117 Preparing for print...
    G28
    BED_MESH_CALIBRATE
    HEAT_EXTRUDERS TEMP=210
    PRIME_EXTRUDERS
    M117 Ready to Print!

[gcode_macro PRINT_CANCEL_SAFE]
description: Cancel print safely
gcode:
    TURN_OFF_HEATERS
    EMERGENCY_RETRACT_ALL
    G28
    M117 Print Cancelled

# ============================================================================
# QUICK PRESETS
# ============================================================================

[gcode_macro PRESET_PLA]
description: Set temperatures for PLA printing
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=200
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=60
    M117 PLA Preset - Waiting for temps...

[gcode_macro PRESET_PETG]
description: Set temperatures for PETG printing
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=230
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=230
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=80
    M117 PETG Preset - Waiting for temps...

[gcode_macro PRESET_ABS]
description: Set temperatures for ABS printing
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=240
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=240
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=100
    M117 ABS Preset - Waiting for temps...
